# Incluido dentro del server existente de Nginx (puerto 80).
# No modifica las rutas de Erlang /app/ ni /api/.
location = /gemelo { return 302 /gemelo/app; }
location = /gemelo/ { return 302 /gemelo/app; }

location = /gemelo/app {
    proxy_pass http://127.0.0.1:8064/app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /gemelo/api/ {
    proxy_pass http://127.0.0.1:8064/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
